; ===== 视觉几何参数 =====
[VisionGeometry]
; ArUco 码物理边长 (mm)，影响 PnP 尺度
MarkerSizeMm=40.0

; ===== 视觉质量门控 =====
[VisionQuality]
; 多帧检测采样帧数
FrameCount=15
; 最少有效帧数 (低于此值本批无效)
MinValidFrames=8
; 一批失败后重试批数
BatchRetryCount=1
; 单帧重投影误差门控 (px)
ReprojectionErrorMaxPx=2.5
; 角点贴边门控 (px)，角点离边缘小于此值视为贴边
CornerBorderMarginPx=5
; 跳变剔除阈值 x/y (mm)
JumpXyMm=2.0
; 跳变剔除阈值 yaw (deg)
JumpYawDeg=1.0

; ===== 自动抬升闭环控制 =====
[AutoLiftControl]
; x/y 稳定阈值 (mm)
SettleXyMm=0.15
; yaw 稳定阈值 (deg)
SettleYawDeg=0.15
; 连续稳定次数 (达到后认为该高度稳定)
StablePassCount=1
; 每个高度最多补偿次数
MaxCorrectionCommandsPerHeight=5
; 补偿增益 (0~1)，每次只补误差的比例
CorrectionGain=0.70
; 残差增长停止比例：补偿后 score > 旧score * 此值时停止
ResidualGrowthStopRatio=1.10
; 跨高度一致性 x/y 容差 (mm)
CrossHeightXyMm=1.5
; 跨高度一致性 yaw 容差 (deg)
CrossHeightYawDeg=0.3
